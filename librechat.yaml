version: '1.2.8'

# Interface Configuration
interface:
  customWelcome: "Welcome to Corust.ai! Enjoy your experience."
  fileSearch: true
  # privacyPolicy:
    # externalUrl: "https://librechat.ai/privacy-policy"
    # openNewTab: true
  # termsOfService:
    # externalUrl: "https://librechat.ai/tos"
    # openNewTab: true
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: false
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  agents: true

# Registration Configuration
registration:
  socialLogins:
    - github
    - google

# Actions Configuration
actions:
  allowedDomains:
    - librechat.ai
    - google.com

# Endpoints Configuration
endpoints:
  custom:
    - name: "OpenAI"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "https://api.openai.com/v1"
      models:
        default:
          - "gpt-3.5-turbo"
          - "gpt-4"
        fetch: true
      titleConvo: true
      titleModel: "gpt-3.5-turbo"
      summarize: true
      summaryModel: "gpt-3.5-turbo"
      forcePrompt: false

# File Configuration - Disable file uploads
fileConfig:
  endpoints:
    default:
      disabled: true  # 禁用所有端点的文件上传
    openAI:
      disabled: true  # 禁用OpenAI端点的文件上传
    OpenAI:
      disabled: true  # 禁用自定义OpenAI端点的文件上传
    custom:
      disabled: true  # 禁用自定义端点的文件上传
    assistants:
      disabled: true  # 禁用Assistants端点的文件上传
    agents:
      disabled: true  # 禁用Agents端点的文件上传

# Cache Configuration
cache: true
